<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" font-family="'IBM Plex Mono','DejaVu Sans Mono',monospace" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Bicycle steering geometry: head angle, fork offset, wheel radius and trail</title>
  <rect width="720" height="440" fill="#050505"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#4fb8c8"/>
    </marker>
  </defs>
  <!-- grid -->
  <g stroke="#141414" stroke-width="1">
    <path d="M0 40H720M0 80H720M0 120H720M0 160H720M0 200H720M0 240H720M0 280H720M0 320H720M0 360H720M0 400H720"/>
    <path d="M40 0V440M80 0V440M120 0V440M160 0V440M200 0V440M240 0V440M280 0V440M320 0V440M360 0V440M400 0V440M440 0V440M480 0V440M520 0V440M560 0V440M600 0V440M640 0V440M680 0V440"/>
  </g>
  <!-- ground -->
  <line x1="60" y1="330" x2="660" y2="330" stroke="#8a8a8a" stroke-width="1.5"/>
  <text x="600" y="322" fill="#8a8a8a" font-size="11">GROUND</text>
  <!-- wheel, R = 370 mm at 0.378 px/mm -->
  <circle cx="360" cy="190" r="140" fill="none" stroke="#d8d8d8" stroke-width="2"/>
  <circle cx="360" cy="190" r="4" fill="#4fb8c8"/>
  <!-- steering axis, theta = 64 deg -->
  <line x1="268.4" y1="40" x2="409.8" y2="330" stroke="#4fb8c8" stroke-width="1.5" stroke-dasharray="14 4 2 4"/>
  <line x1="409.8" y1="330" x2="416.0" y2="343" stroke="#4fb8c8" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="160" y="62" fill="#4fb8c8" font-size="11">STEERING AXIS</text>
  <!-- offset: perpendicular from axle to axis -->
  <line x1="360" y1="190" x2="345.1" y2="197.3" stroke="#e8ff00" stroke-width="1.5"/>
  <text x="250" y="210" fill="#e8ff00" font-size="11">OFFSET 44</text>
  <!-- R dimension -->
  <line x1="360" y1="190" x2="540" y2="190" stroke="#555" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="530" y1="190" x2="530" y2="330" stroke="#4fb8c8" stroke-width="1" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="540" y="264" fill="#4fb8c8" font-size="12">R 370</text>
  <!-- trail dimension -->
  <line x1="360" y1="330" x2="360" y2="366" stroke="#555" stroke-width="1"/>
  <line x1="409.8" y1="330" x2="409.8" y2="366" stroke="#555" stroke-width="1"/>
  <line x1="360" y1="358" x2="409.8" y2="358" stroke="#e8ff00" stroke-width="1.2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="372" y="382" fill="#e8ff00" font-size="12">T 131.5</text>
  <!-- head angle -->
  <path d="M369.8 330 A40 40 0 0 1 392.3 294.0" fill="none" stroke="#4fb8c8" stroke-width="1"/>
  <text x="318" y="320" fill="#4fb8c8" font-size="13">θ 64°</text>
  <!-- equations -->
  <g fill="#bdbdbd" font-size="11">
    <text x="30" y="372">T  = (R·cos θ − offset) / sin θ</text>
    <text x="30" y="388">Tm = R·cos θ − offset</text>
    <text x="30" y="404">F  = T·sin θ·cos θ</text>
  </g>
  <!-- title block -->
  <g font-size="10">
    <rect x="404" y="392" width="296" height="38" fill="none" stroke="#4fb8c8" stroke-width="1"/>
    <line x1="452" y1="392" x2="452" y2="430" stroke="#4fb8c8" stroke-width="1"/>
    <text x="412" y="415" fill="#e8ff00" font-size="12" font-weight="bold">CERJ</text>
    <text x="460" y="407" fill="#d8d8d8">BIKELAB TRAIL CALCULATOR · REV 1.0.0</text>
    <text x="460" y="422" fill="#8a8a8a">ORCID 0009-0007-5631-7436 · 2026</text>
  </g>
  <text x="30" y="28" fill="#8a8a8a" font-size="10">DIMENSIONS IN mm · REFERENCE CASE R 370 · OFFSET 44 · θ 64° · TO SCALE</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
